spring.application.name=estoque
server.port=${PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/adega_estoque}
spring.datasource.username=${DATABASE_USER:adega}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
vintra.api.user=${VINTRA_API_USER:}
vintra.api.password=${VINTRA_API_PASSWORD:}
