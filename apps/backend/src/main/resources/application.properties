spring.application.name=estoque
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:8081}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/adega_estoque}
spring.datasource.username=${DATABASE_USER:adega}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# First startup only: creates an administrator when none exists.
vintra.admin.email=${VINTRA_ADMIN_EMAIL:}
vintra.admin.password=${VINTRA_ADMIN_PASSWORD:}
